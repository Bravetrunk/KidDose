    <style>
        :root {
            /* Decelerating ease — motion arrives softly instead of stopping dead */
            --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
            /* Slight overshoot — gives pressed buttons their bounce-back */
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            background-color: #F8F9FD;
            color: #1E2229;
            font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .soft-float {
            box-shadow: 0px 8px 24px rgba(42, 107, 255, 0.08);
        }

        .soft-glow {
            box-shadow: 0px 8px 20px rgba(42, 107, 255, 0.15);
        }

        .red-flag-glow {
            box-shadow: 0px 8px 24px rgba(255, 59, 92, 0.2);
        }

        /* ── Motion system ───────────────────────────────────────────────
           Every animation below is transform/opacity only so it runs on the
           compositor and never blocks input while a clinician is typing.     */

        /* Result cards unfurl into place, staggered down the list */
        @keyframes cardUnfurl {
            from { opacity: 0; transform: translateY(10px) scale(0.985); }
            to   { opacity: 1; transform: none; }
        }
        /* 'backwards' (not 'both') so the finished card leaves transform free for :hover */
        .animate-card-unfurl { animation: cardUnfurl 0.42s var(--ease-soft) backwards; }

        /* Dose figures slide up as they resolve */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }
        .animate-reveal-up { animation: revealUp 0.38s var(--ease-soft) backwards; }

        /* A single soft swell that puts the eye on the critical number */
        @keyframes doseEmphasis {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .animate-dose-emphasis { animation: doseEmphasis 1.1s var(--ease-soft) 1 backwards; }
        /* The modal shows one focused value, so it can breathe a little longer */
        .animate-dose-pulse { animation: doseEmphasis 2.2s ease-in-out 3; }

        /* Safety warnings tilt rather than shake — urgent, not alarming */
        @keyframes gentleTilt {
            0%   { transform: rotate(0deg); }
            20%  { transform: rotate(-1deg); }
            45%  { transform: rotate(1deg); }
            70%  { transform: rotate(-1deg); }
            100% { transform: rotate(0deg); }
        }
        .animate-gentle-tilt { animation: gentleTilt 0.55s var(--ease-soft); }

        /* Overlays: backdrop washes in, panel rises to meet it */
        @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to   { opacity: 1; transform: none; }
        }
        .animate-backdrop-in { animation: backdropIn 0.24s ease-out both; }
        .animate-panel-in { animation: panelIn 0.34s var(--ease-soft) both; }

        /* Cross-fade for controls that swap when the patient mode changes */
        @keyframes fadeSwap {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: none; }
        }
        .animate-fade-swap { animation: fadeSwap 0.3s var(--ease-soft) backwards; }

        /* Colour/elevation changes glide between safe → caution → contraindicated */
        .morph {
            transition: background-color 0.5s var(--ease-soft),
                        border-color 0.5s var(--ease-soft),
                        box-shadow 0.5s var(--ease-soft);
        }

        /* Tactile press: sinks under the finger, bounces back on release */
        .press { transition: transform 0.2s var(--ease-bounce); }
        .press:active { transform: scale(0.96); }

        /* Cards lift slightly under a real pointer; skipped on touch */
        @media (hover: hover) {
            .card-hover { transition: transform 0.25s var(--ease-soft); }
            .card-hover:hover { transform: translateY(-2px); }
        }

        /* Honour the OS setting — vestibular safety outranks polish */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F4FA;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
    </style>
</head>

        // Preparations dispensed as whole units (tablets/sachets) rather than a measured volume
        function getUnitLabel(conc) {
            const label = conc.label;
            if (label.includes('เม็ด') || label.includes('Capsule')) return 'เม็ด';
            if (label.includes('ซอง') || label.includes('Sachet')) return 'ซอง';
            return 'mL';
        }

        // Renders "5 – 15" for a range, or just "5" when both ends match
        function formatRange(min, max) {
            return (max !== null && max !== undefined && max !== min) ? `${min} – ${max}` : `${min}`;
        }

        function prefersReducedMotion() {
            return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        }

        // Switching mode never rewrites an entered value — it only changes granularity.
        const PATIENT_MODES = {
            infant: {
                icon: '🍼',
                label: 'ทารก (Infant)',
                hint: 'แรกเกิด – 3 ปี · ปรับน้ำหนักละเอียดขั้นละ 0.1 kg',

        // Animates the number itself whenever it changes, so a dose that shifts
        // under the clinician's fingers is never mistaken for one that held still.
        function DoseValue({ value, className = '' }) {
            const ref = React.useRef(null);
            const prev = React.useRef(value);
            const anim = React.useRef(null);

            React.useEffect(() => {
                if (prev.current === value) return;
                prev.current = value;
                const el = ref.current;
                if (!el || !el.animate || prefersReducedMotion()) return;
                if (anim.current) anim.current.cancel();
                anim.current = el.animate(
                    [
                        { opacity: 0.25, transform: 'translateY(-5px) scale(1.05)' },
                        { opacity: 1, transform: 'none' }
                    ],
                    { duration: 260, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                );
            }, [value]);

            return <span ref={ref} className={className}>{value}</span>;
        }

        // Animates its own height when the content inside changes size, so swapping
        // patient modes glides open instead of snapping the layout.
        function SmoothResize({ children, className = '' }) {
            const outer = React.useRef(null);
            const inner = React.useRef(null);
            const lastH = React.useRef(null);

            React.useLayoutEffect(() => {
                const o = outer.current, i = inner.current;
                if (!o || !i || typeof ResizeObserver === 'undefined') return;

                const sync = () => {
                    const next = i.offsetHeight;
                    const prev = lastH.current;
                    lastH.current = next;
                    if (prev === null || prev === next || !o.animate || prefersReducedMotion()) return;
                    o.animate(
                        [{ height: prev + 'px' }, { height: next + 'px' }],
                        { duration: 320, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }
                    );
                };

                sync();
                const ro = new ResizeObserver(sync);
                ro.observe(i);
                return () => ro.disconnect();
            }, []);

            return (
                <div ref={outer} className={`overflow-hidden ${className}`}>
                    <div ref={inner}>{children}</div>
                </div>
            );
        }

        // Locks background scrolling and wires Escape while an overlay is open.
        function useOverlayDismiss(onDismiss) {
            const cb = React.useRef(onDismiss);
            cb.current = onDismiss;

            React.useEffect(() => {
                const onKey = (e) => { if (e.key === 'Escape') cb.current(); };
                const prevOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                document.addEventListener('keydown', onKey);
                return () => {
                    document.removeEventListener('keydown', onKey);
                    document.body.style.overflow = prevOverflow;
                };
            }, []);
        }

        function ConcentrationInfo({ drug, conc, onClose }) {
            useOverlayDismiss(onClose);
            const unit = drug.doseUnitLabel || 'mg';
            const perMl = conc.mg ? parseFloat((conc.mg / conc.ml).toFixed(3)) : null;

        function calculateDose(drug, weightKg, ageMonths, isG6PD, hasRenal, overrideConcId) {
            const alerts = [];
            let hasRedFlag = false;
            let hasAmberWarning = false;

            const selectedConc = drug.concentrations.find(c => c.id === overrideConcId) ||
                                 drug.concentrations.find(c => c.isDefault) ||
                                 drug.concentrations[0];

            const base = {
                drug,
                calculatedMg: 0,
                calculatedMgMax: null,
                calculatedMl: 0,
                calculatedMlMax: null,
                selectedConc,
                isMaxCapReached: false,
                hasRedFlag: false,
                hasAmberWarning: false,
                alertMessages: [],
                bandDesc: null,
                noDose: false,
            };

            if (weightKg <= 0) return base;

            // 1. Safety Check: Age Restrictions
            if (drug.safetyRule.minAgeMonths > 0) {
                if (ageMonths === null || ageMonths === undefined || isNaN(ageMonths)) {
                    hasAmberWarning = true;
                    alerts.push('โปรดระบุอายุผู้ป่วยเพื่อยืนยันความปลอดภัยทางคลินิก');
                } else if (ageMonths < drug.safetyRule.minAgeMonths) {
                    hasRedFlag = true;
                    alerts.push(`ข้อห้ามใช้: ห้ามใช้ในเด็กอายุต่ำกว่า ${drug.safetyRule.minAgeMonths} เดือน`);
                }
            }

            // 1.5 Safety Check: Weight Restrictions
            if (drug.safetyRule.minWeightKg && weightKg < drug.safetyRule.minWeightKg) {
                hasRedFlag = true;
                alerts.push(`ข้อห้ามใช้: น้ำหนักผู้ป่วยต้องไม่น้อยกว่า ${drug.safetyRule.minWeightKg} kg`);
            }

            // 2. Safety Check: G6PD Deficiency
            if (isG6PD && !drug.safetyRule.g6pdSafe) {
                hasRedFlag = true;
                alerts.push('RED FLAG: ห้ามใช้ในผู้ป่วยภาวะพร่อง G6PD (เสี่ยงต่อภาวะเม็ดเลือดแดงแตกอย่างรุนแรง)');
            }

            // 3. Safety Check: Renal Impairment
            if (hasRenal && !drug.safetyRule.renalSafe) {
                hasAmberWarning = true;
                alerts.push('CAUTION: ผู้ป่วยไตบกพร่อง ต้องปรับลด Dose ตามแนวทางการรักษา');
            }

            // 4a. Age-band dosing — reference gives a volume per age range, not a mg/kg rule
            if (drug.doseRule.doseType === 'ageBand') {
                if (ageMonths === null || ageMonths === undefined || isNaN(ageMonths)) {
                    hasAmberWarning = true;
                    alerts.push('ยานี้กำหนดขนาดยาตามช่วงอายุ — โปรดระบุอายุผู้ป่วยก่อนคำนวณ');
                    return { ...base, hasRedFlag, hasAmberWarning, alertMessages: alerts, noDose: true };
                }

                const band = drug.doseRule.ageBands.find(
                    b => ageMonths >= b.minAgeMonths && ageMonths < b.maxAgeMonths
                );

                if (!band) {
                    hasAmberWarning = true;
                    alerts.push('อายุผู้ป่วยอยู่นอกช่วงที่เอกสารอ้างอิงระบุขนาดยาไว้ — โปรดตรวจสอบจากแหล่งอ้างอิงอื่น');
                    return { ...base, hasRedFlag, hasAmberWarning, alertMessages: alerts, noDose: true };
                }

                let mlMin, mlMax;
                if (band.mlMin !== undefined) {
                    mlMin = band.mlMin;
                    mlMax = band.mlMax;
                } else if (band.mlKgMin !== undefined) {
                    mlMin = band.mlKgMin * weightKg;
                    mlMax = band.mlKgMax * weightKg;
                } else {
                    mlMin = (band.mgKgMin * weightKg / selectedConc.mg) * selectedConc.ml;
                    mlMax = (band.mgKgMax * weightKg / selectedConc.mg) * selectedConc.ml;
                }

                const toMg = (ml) => selectedConc.mg
                    ? parseFloat(((ml / selectedConc.ml) * selectedConc.mg).toFixed(1))
                    : 0;

                return {
                    ...base,
                    calculatedMl: parseFloat(mlMin.toFixed(2)),
                    calculatedMlMax: parseFloat(mlMax.toFixed(2)),
                    calculatedMg: toMg(mlMin),
                    calculatedMgMax: toMg(mlMax),
                    bandDesc: band.desc,
                    hasRedFlag,
                    hasAmberWarning,
                    alertMessages: alerts,
                };
            }

            // 4b. Standard mg/kg Dose Calculation
            const rawMg = weightKg * drug.doseRule.stdMgKgDose;
            let isMaxCapReached = false;
            let finalMg = rawMg;

            if (rawMg >= drug.doseRule.maxSingleDoseMg) {
                finalMg = drug.doseRule.maxSingleDoseMg;
                isMaxCapReached = true;
                alerts.push(`จำกัด Dose สูงสุดที่ ${drug.doseRule.maxSingleDoseMg} ${drug.doseUnitLabel || 'mg'} (Adult Max Cap)`);
            }

            // 5. Volume Calculation (mL)
            const rawMl = (finalMg / selectedConc.mg) * selectedConc.ml;

            return {
                ...base,
                calculatedMg: parseFloat(finalMg.toFixed(1)),
                calculatedMl: parseFloat(rawMl.toFixed(1)),
                isMaxCapReached,
                hasRedFlag,
                hasAmberWarning,
                alertMessages: alerts,
            };
        }

                                    {drug.genericNameEn}
                                </h3>
                                <span className="text-xs px-2.5 py-0.5 rounded-full font-bold bg-slate-100 text-textMuted">
                                    {drug.category}
                                </span>
                            </div>
                            <p className="text-xs sm:text-sm font-medium text-textMuted mt-0.5">
                                {drug.genericNameTh}
                            </p>
                        </div>

                        {/* Favorite Pin Button */}
                        <button
                            onClick={onTogglePin}
                            className={`press p-2 rounded-2xl text-base ${
                                isPinned ? 'bg-amber-100 text-amber-500' : 'bg-slate-100 text-slate-400 hover:text-amber-500'
                            }`}
                        >
                            {isPinned ? '⭐' : '☆'}
                        </button>
                    </div>

                    {/* RED FLAG Banner (if active) */}
                    {hasRedFlag ? (
                        <div className="animate-reveal-up my-3 p-3 bg-redFlag text-white rounded-2xl text-xs font-bold space-y-1">
                            <div className="flex items-center gap-1.5 text-sm">
                                <span>⛔</span>
                                <span>RED FLAG WARNING</span>
                            </div>
                            {alertMessages.map((msg, idx) => (
                                <p key={idx} className="font-medium text-red-100">
                                    • {msg}
                                </p>
                            ))}
                            <p className="text-[11px] pt-1 text-red-200 font-normal underline">
                                แตะเพื่อดูรายละเอียดความปลอดภัยทางคลินิกเพิ่มเติม
                            </p>
                        </div>
                    ) : (
                        <>
                            {/* AMBER WARNING / MAX CAP Banner (if active) */}
                            {(isMaxCapReached || hasAmberWarning) && (
                                <div className="animate-reveal-up my-2 p-2.5 bg-amber-500/10 border border-amber-500/30 text-amber-800 rounded-2xl text-xs font-bold">
                                    {alertMessages.map((msg, idx) => (
                                        <p key={idx} className="flex items-center gap-1">
                                            <span>⚠️</span> {msg}
                                        </p>
                                    ))}
                                </div>
                            )}

                            {}
                            {/* Dose Calculation Output Area */}
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 my-2 pt-2 border-t border-slate-200/50 lg:flex-col lg:items-stretch lg:gap-2">
                                <div
                                    className="animate-reveal-up"
                                    style={{ animationDelay: `${stagger + 90}ms` }}
                                >
                                    {noDose ? (
                                        <p className="text-sm font-bold text-amber-700">
                                            — ไม่สามารถคำนวณขนาดยาอัตโนมัติได้ —
                                        </p>
                                    ) : (
                                        <div className="flex items-baseline gap-2 flex-wrap">
                                            <DoseValue
                                                value={formatRange(calculatedMl, calculatedMlMax)}
                                                className={`animate-dose-emphasis inline-block origin-left text-3xl sm:text-4xl font-black tracking-tight ${volumeColorClass}`}
                                            />
                                            <span className={`text-xl font-bold ${volumeColorClass}`}>
                                                {getUnitLabel(selectedConc)}
                                            </span>
                                            {calculatedMg > 0 && (
                                                <span className="text-xs font-semibold text-textMuted">
                                                    (<DoseValue
                                                        value={formatRange(calculatedMg, calculatedMgMax)}
                                                        className="inline-block"
                                                    /> {drug.doseUnitLabel || 'mg'})
                                                </span>
                                            )}
                                        </div>
                                    )}
                                    <p className="text-xs font-bold text-textCharcoal mt-0.5">
                                        🗓️ {drug.doseRule.frequencyText}
                                    </p>
                                    {bandDesc && (
                                        <p className="text-[11px] font-semibold text-brandBlue mt-0.5">
                                            📋 {bandDesc}
                                        </p>
                                    )}
                                </div>

                                {/* Concentration Selector Dropdown */}
                                <div className="self-start sm:self-auto" onClick={(e) => e.stopPropagation()}>
                                    <label className="flex items-center gap-1.5 text-[10px] font-bold text-textMuted uppercase mb-1">
                                        ความเข้มข้นยา (Preparation)
                                        <button
                                            onClick={(e) => { e.stopPropagation(); setInfoOpen(true); }}
                                            aria-label="ดูข้อมูลความเข้มข้นยา"
                                            className="press w-4 h-4 shrink-0 rounded-full bg-slate-200 text-textMuted text-[10px] font-black leading-none hover:bg-brandBlue hover:text-white transition-colors"
                                        >
                                            i
                                        </button>
                                    </label>
                                    <select
                                        value={selectedConc.id}
                                        onChange={(e) => onConcChange(e.target.value)}
                                        className="bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-bold text-textCharcoal outline-none focus:border-brandBlue cursor-pointer shadow-sm"
                                    >
                                        {drug.concentrations.map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.label}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </>
                    )}

                    {/* Card Footer Hint — mt-auto keeps it aligned across cards in a grid row */}
                    <div className="mt-3 lg:mt-auto pt-2 border-t border-slate-100 flex items-center justify-between gap-2 text-[11px] text-textMuted font-medium">
                        <span>💡 {drug.clinicalNote}</span>
                        <span className="font-bold text-brandBlue">รายละเอียด ➔</span>
                    </div>
                </div>

                {infoOpen && (
                    <ConcentrationInfo
                        drug={drug}
                        conc={selectedConc}
                        onClose={() => setInfoOpen(false)}
                    />
                )}
                </div>
            );
        }

        function ClinicalDetailModal({ result, weightKg, ageMonths, onClose }) {
            const { drug, calculatedMg, calculatedMgMax, calculatedMl, calculatedMlMax, selectedConc,
                    isMaxCapReached, hasRedFlag, alertMessages, bandDesc, noDose } = result;
            const unitLabel = getUnitLabel(selectedConc);
            const doseUnit = drug.doseUnitLabel || 'mg';
            useOverlayDismiss(onClose);

            return (
                <div
                    onClick={onClose}
                    className="animate-backdrop-in fixed inset-0 z-50 bg-textCharcoal/60 backdrop-blur-sm flex items-center justify-center p-4"
                >
                    <div
                        onClick={(e) => e.stopPropagation()}
                        className="animate-panel-in bg-white rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 soft-glow border border-slate-100"
                    >
                        {/* Modal Header */}
                        <div className="flex items-start justify-between border-b border-slate-100 pb-4 mb-4">
                            <div>
                                <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-brandBlue">
                                    {drug.category}
                                </span>
                                <h2 className="text-xl font-extrabold text-textCharcoal mt-1">
                                    {drug.genericNameEn}
                                </h2>
                                <p className="text-xs font-medium text-textMuted">
                                    {drug.genericNameTh}
                                </p>
                            </div>
                            <button
                                onClick={onClose}
                                className="press w-8 h-8 shrink-0 rounded-full bg-slate-100 text-textMuted font-bold hover:bg-slate-200 text-sm"
                            >
                                ✕
                            </button>
                        </div>

                        {/* Calculation Steps Breakdown */}
                        <div className="space-y-4">
                            <div className="bg-bgWarm p-4 rounded-2xl border border-slate-100">
                                <h4 className="text-xs font-bold text-textMuted uppercase tracking-wider mb-2">
                                    📐 สูตรการคำนวณ (Calculation Breakdown)
                                </h4>
                                {drug.doseRule.doseType === 'ageBand' ? (
                                    <div className="text-xs space-y-1.5 font-medium text-textCharcoal">
                                        <p>• เกณฑ์ขนาดยา: <span className="font-bold">กำหนดตามช่วงอายุ (Age-band dosing)</span></p>
                                        <p>• อายุผู้ป่วย: <span className="font-bold">{ageMonths ?? 'ไม่ระบุ'} เดือน</span></p>
                                        <p>• น้ำหนักผู้ป่วย: <span className="font-bold">{weightKg} kg</span></p>
                                        {bandDesc && (
                                            <p>• ช่วงที่ตรงกับผู้ป่วย: <span className="font-bold">{bandDesc}</span></p>
                                        )}
                                        <p>• ความเข้มข้นที่เลือก: <span className="font-bold">{selectedConc.label}</span></p>
                                        {noDose ? (
                                            <p className="pt-1 text-amber-700 font-bold text-sm">
                                                ➔ ไม่สามารถคำนวณขนาดยาได้ — โปรดตรวจสอบจากแหล่งอ้างอิงอื่น
                                            </p>
                                        ) : (
                                            <p className="pt-1 text-brandBlue font-bold text-sm">
                                                ➔ ขนาดยาต่อครั้ง:{' '}
                                                <span className="animate-dose-pulse inline-block origin-left text-base">
                                                    {formatRange(calculatedMl, calculatedMlMax)} {unitLabel}
                                                </span>
                                                {calculatedMg > 0 && ` (${formatRange(calculatedMg, calculatedMgMax)} ${doseUnit})`}
                                            </p>
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-xs space-y-1.5 font-medium text-textCharcoal">
                                        <p>• น้ำหนักผู้ป่วย: <span className="font-bold">{weightKg} kg</span></p>
                                        <p>• ขนาดกำหนดมาตรฐาน: <span className="font-bold">{drug.doseRule.stdMgKgDose} {doseUnit}/kg/dose</span></p>
                                        <p>• Raw Calculated: {weightKg} × {drug.doseRule.stdMgKgDose} = <span className="font-bold">{(weightKg * drug.doseRule.stdMgKgDose).toFixed(1)} {doseUnit}</span></p>
                                        {isMaxCapReached && (
                                            <p className="text-amber-600 font-bold">
                                                • ⚠️ Capped at Max Single Dose: {drug.doseRule.maxSingleDoseMg} {doseUnit}
                                            </p>
                                        )}
                                        <p>• ความเข้มข้นที่เลือก: <span className="font-bold">{selectedConc.label}</span></p>
                                        <p className="pt-1 text-brandBlue font-bold text-sm">
                                            ➔ ปริมาตรยาคำนวณได้:{' '}
                                            <span className="animate-dose-pulse inline-block origin-left text-base">
                                                {calculatedMl} {unitLabel}
                                            </span>
                                            {' '}({calculatedMg} {doseUnit})
                                        </p>
                                    </div>
                                )}
                            </div>

                            {/* Safety & Contraindications */}
                            <div>
                                <h4 className="text-xs font-bold text-textMuted uppercase tracking-wider mb-2">
                                    🛡️ ข้อจำกัดและข้อควรระวัง (Safety Rules)
                                </h4>
                                <ul className="text-xs space-y-2">
                                    <li className={`p-2.5 rounded-xl border ${drug.safetyRule.minAgeMonths > 0 && ageMonths < drug.safetyRule.minAgeMonths ? 'bg-redBg border-redFlag/40 text-redFlag font-bold' : 'bg-slate-50 border-slate-100 text-textCharcoal'}`}>
                                        👶 Age Constraint: ต้องมีอายุอย่างน้อย {drug.safetyRule.minAgeMonths} เดือนขึ้นไป (อายุปัจจุบัน: {ageMonths ?? 'ไม่ระบุ'} เดือน)
                                    </li>
                                    {drug.safetyRule.minWeightKg && (
                                    <li className={`p-2.5 rounded-xl border ${weightKg < drug.safetyRule.minWeightKg ? 'bg-redBg border-redFlag/40 text-redFlag font-bold' : 'bg-slate-50 border-slate-100 text-textCharcoal'}`}>
                                        ⚖️ Weight Constraint: น้ำหนักต้องไม่น้อยกว่า {drug.safetyRule.minWeightKg} kg
                                    </li>
                                    )}
                                    <li className={`p-2.5 rounded-xl border ${!drug.safetyRule.g6pdSafe ? 'bg-redBg border-redFlag/40 text-redFlag font-bold' : 'bg-slate-50 border-slate-100 text-textCharcoal'}`}>
                                        🧬 G6PD Safety: {drug.safetyRule.g6pdSafe ? '✅ ปลอดภัยสำหรับผู้ป่วย G6PD' : '🔴 ห้ามใช้ในผู้ป่วยภาวะพร่อง G6PD'}
                                    </li>
                                    <li className={`p-2.5 rounded-xl border ${!drug.safetyRule.renalSafe ? 'bg-amberBg border-amberWarning/40 text-amber-800 font-bold' : 'bg-slate-50 border-slate-100 text-textCharcoal'}`}>
                                        🫘 Renal Safety: {drug.safetyRule.renalSafe ? '✅ ปลอดภัยสำหรับผู้ป่วยไตปกติ' : '⚠️ ต้องปรับลด Dose ในผู้ป่วยโรคไต'}
                                    </li>
                                    {drug.safetyRule.contraindicationMessages.map((msg, idx) => (
                                        <li key={idx} className="p-2.5 rounded-xl border bg-redBg border-redFlag/30 text-textCharcoal">
                                            ⛔ {msg}
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {/* Clinical Guidance Notes */}
                            <div className="bg-blue-50/60 p-4 rounded-2xl border border-brandBlue/20">
                                <h4 className="text-xs font-bold text-brandBlue uppercase mb-1">
                                    👨‍⚕️ Clinical Note & Prescribing Advice
                                </h4>
                                <p className="text-xs text-textCharcoal font-medium leading-relaxed">
                                    {drug.clinicalNote}
                                </p>
                            </div>
                        </div>

                        {/* Modal Action Footer */}
                        <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end">
                            <button
                                onClick={onClose}
                                className="press px-5 py-2.5 rounded-full bg-brandBlue text-white font-bold text-xs hover:bg-brandBlueHover shadow-md"
                            >
                                รับทราบ และปิดหน้าต่าง
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<KidDoseApp />);
    </script>
</body>
</html>
